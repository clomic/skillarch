set -g default-terminal "xterm-kitty"
set -ga terminal-overrides ',xterm-kitty:RGB'
set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on

set -g history-limit 100000
set -g renumber-windows on
set -s set-clipboard on

unbind r
bind r source-file $XDG_CONFIG_HOME/tmux/tmux.conf \; display "!! Reloaded !!"

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g detach-on-destroy off

bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# implement vim motions for pane movement
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# M = Alt
bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window
bind -n S-Up last-window
bind -n S-Down last-window

# B for back a window, N for next window. P still works
bind b previous-window

bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind -n WheelDownPane select-pane -t= \; send-keys -M
bind -n C-WheelUpPane select-pane -t= \; copy-mode -e \; send-keys -M
bind -T copy-mode-vi    C-WheelUpPane   send-keys -X halfpage-up
bind -T copy-mode-vi    C-WheelDownPane send-keys -X halfpage-down

# To copy, left click and drag to highlight text in yellow,
# once you release left click yellow text will disappear and will automatically be available in clipboard
# 
# Use vim keybindings in copy mode
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v                 send-keys -X begin-selection
bind-key -T copy-mode-vi C-v               send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y                 send-keys -X copy-pipe-and-cancel 'xsel -ip'
bind-key -T copy-mode-vi Enter             send-keys -X copy-pipe-and-cancel 'xsel -ip'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe 'xsel -ip'

# for pi.dev
set -g extended-keys on
set -g extended-keys-format csi-u

##### Display Popups #####
# https://github.com/ericmckevitt/Dotfiles/blob/main/tmux.conf

bind C-l display-popup -T "Lazygit" -d "#{pane_current_path}" \
  -w 80% -h 80% -E "lazygit"
bind C-n display-popup -T "Create a new session" \
  -E 'bash -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'
bind C-s display-popup -T "Session Switcher" \
  -E "tmux list-sessions | cut -d':' -f1 | fzf --highlight-line --no-info --padding=0 --border=none --prompt='Choose a session: ' | xargs tmux switch-client -t"
bind C-p display-popup -w 90% -h 90% -E "ipython"
bind C-y display-popup -d "#{pane_current_path}" -w 90% -h 90% -E "yazi 1>/dev/null"
bind C-t display-popup -T "Temporary Terminal" -d "#{pane_current_path}" -w 75% -h 75% -E "zsh"

##### Display Menu #####

bind d display-menu -T "#[align=centre]Edit dotfiles" -x C -y C \
  ".zshrc"    z  "display-popup -w 80% -h 80% -E 'nvim ~/.zshrc'" \
  "tmux.conf" t  "display-popup -w 80% -h 80% -E 'nvim $XDG_CONFIG_HOME/tmux/tmux.conf'" \
  "Exit"      q  ""

##### Plugins #####
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_action 'copy-pipe'


##### Catppuccin theme #####
# Init
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_reset "true"
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Configure the catppuccin plugin
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"

# Status left look and feel
set -g status-left-length 100
set -g status-left ""
set -ga status-left "#{?client_prefix,#{#[bg=#{@thm_red},fg=#{@thm_bg},bold]  #S },#{#[bg=#{@thm_bg},fg=#{@thm_green}]  #S }}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_maroon}]  #{pane_current_command} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]│"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_blue}]  #{=/-32/...:#{s|$USER|~|:#{b:pane_current_path}}} "
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_overlay_0},none]#{?window_zoomed_flag,│,}"
set -ga status-left "#[bg=#{@thm_bg},fg=#{@thm_yellow}]#{?window_zoomed_flag,   zoom ,}"

# Status right look and feel
set -g status-right-length 100
set -g status-right ""
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_blue}] 󰭦 %d/%m/%Y "
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}, none]│"
set -ga status-right "#[bg=#{@thm_bg},fg=#{@thm_teal}] 󰅐 %H:%M "

# Configure Tmux
set -g status-position top
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "absolute-centre"

# Pane border look and feel
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_crust}"
setw -g pane-border-lines single

# Window look and feel
set -wg automatic-rename on
set -g automatic-rename-format "Win"

set -g window-status-format " #I#{?#{!=:#{window_name},Win},: #W,} "
set -g window-status-current-format " #I#{?#{!=:#{window_name},Win},: #W,} "
set -g window-status-style "bg=#{@thm_bg},fg=#{@thm_rosewater}"
set -g window-status-current-style "bg=#{@thm_peach},fg=#{@thm_bg},bold"
set -g window-status-last-style "bg=#{@thm_bg},fg=#{@thm_peach}"
set -g window-status-activity-style "bg=#{@thm_red},fg=#{@thm_bg}"
set -g window-status-bell-style "bg=#{@thm_red},fg=#{@thm_bg},bold"
set -gF window-status-separator "#[bg=#{@thm_bg},fg=#{@thm_overlay_0}]│"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

set -gF message-style "fg=#{@thm_teal},bg=default,fill=#{@thm_bg}"
set -gF message-command-style "fg=#{@thm_teal},bg=default,fill=#{@thm_bg}"


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'